[install]
# Write exact versions, never ranges.
exact = true
# No dependency lifecycle scripts, locally or in CI.
ignoreScripts = true
# Resolve only versions published at least 7 days ago, so a hijacked release has time to be caught before it
# reaches us. Our own packages may be taken at once (org rule) and are exempt by exact name, since Bun takes no
# scope patterns here (Bun 1.4.4 docs/runtime/bunfig.mdx).
minimumReleaseAge = 604800 # seconds
minimumReleaseAgeExcludes = ["@unset-sh/brand"]

[install.scopes]
# @unset-sh packages come from GitHub Packages, which needs a token even to read: tooling's check passes
# GITHUB_TOKEN with packages: read as GITHUB_PACKAGES_TOKEN to the install step only, and a read:packages token
# elsewhere. Never NPM_CONFIG_TOKEN, which Bun also sends to the default registry (Bun 1.4.4 docs/pm/npmrc.mdx).
"@unset-sh" = { url = "https://npm.pkg.github.com", token = "$GITHUB_PACKAGES_TOKEN" }
