name: pr-policy

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled, ready_for_review]

permissions: {}

concurrency:
  group: pr-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  policy:
    # tooling main after unset-sh/tooling#33.
    uses: unset-sh/tooling/.github/workflows/ci-pr-policy.yml@cbc0732281b48db638da554fe163d156e64f9066
    permissions:
      contents: read
      pull-requests: read
